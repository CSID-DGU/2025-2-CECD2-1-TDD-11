services:
  mariadb:
    image: mariadb:latest
    restart: always
    environment:
      MARIADB_USER: talktobook
      MARIADB_PASSWORD: password
      MARIADB_DATABASE: talktobook
      MARIADB_ROOT_PASSWORD: password
      MYSQL_TCP_PORT: 3306
      MYSQL_UNIX_PORT: 3306
    ports:
      - 3311:3306
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "--silent",
          "-h",
          "localhost",
          "-u",
          "talktobook",
          "-ppassword",
        ]
      timeout: 20s
      retries: 10

  redis:
    image: redis:latest
    restart: always
    ports:
      - 6381:6379

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: talktobook
      RABBITMQ_DEFAULT_PASS: talktobook_password
    ports:
      - 5672:5672
      - 15672:15672

  localstack:
    container_name: localstack
    image: localstack/localstack:latest
    environment:
      - SERVICES=s3
      - DATA_DIR=/tmp/localstack/data
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - CLEAR_TMP_FOLDER=0
    ports:
      - 4566:4566
      - 4571:4571
    volumes:
      - './localstack:/tmp/localstack'
      - '/var/run/docker.sock:/var/run/docker.sock'
      - './aws:/etc/localstack/init/ready.d'